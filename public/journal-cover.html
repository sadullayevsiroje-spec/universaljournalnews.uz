<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UJN Journal Cover - Volume 1, Issue 1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .cover {
            width: 210mm;
            height: 297mm;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #60a5fa 100%);
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        /* Decorative elements */
        .cover::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
        }
        
        .cover::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -30%;
            width: 80%;
            height: 80%;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
        }
        
        /* Header section */
        .header {
            background: rgba(255,255,255,0.95);
            padding: 30px 40px;
            text-align: center;
            border-bottom: 4px solid #1e40af;
            position: relative;
            z-index: 2;
        }
        
        .institution {
            font-size: 16px;
            color: #1e40af;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        
        .journal-title {
            font-size: 48px;
            font-weight: bold;
            color: #1e3a8a;
            margin: 15px 0;
            letter-spacing: 2px;
            line-height: 1.2;
        }
        
        .journal-subtitle {
            font-size: 18px;
            color: #3b82f6;
            font-style: italic;
            margin-top: 10px;
        }
        
        /* Main content */
        .content {
            position: relative;
            z-index: 2;
            padding: 60px 50px;
            color: white;
            height: calc(100% - 200px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .volume-info {
            text-align: center;
            margin: 40px 0;
        }
        
        .volume-text {
            font-size: 32px;
            font-weight: 300;
            margin-bottom: 15px;
            letter-spacing: 3px;
        }
        
        .issue-text {
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 2px;
        }
        
        .date {
            font-size: 24px;
            font-weight: 600;
            margin-top: 20px;
            letter-spacing: 2px;
        }
        
        /* Medical symbol decoration */
        .medical-symbol {
            text-align: center;
            margin: 50px 0;
            font-size: 120px;
            opacity: 0.3;
        }
        
        /* Topics section */
        .topics {
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            margin: 30px 0;
        }
        
        .topics-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 15px;
            text-align: center;
            letter-spacing: 1px;
        }
        
        .topics-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 14px;
            line-height: 1.8;
        }
        
        .topic-item {
            padding-left: 20px;
            position: relative;
        }
        
        .topic-item::before {
            content: '•';
            position: absolute;
            left: 5px;
            font-size: 20px;
        }
        
        /* Footer */
        .footer {
            background: rgba(30, 58, 138, 0.95);
            padding: 25px 40px;
            text-align: center;
            color: white;
            position: absolute;
            bottom: 0;
            width: 100%;
            z-index: 2;
        }
        
        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        
        .issn {
            font-weight: 600;
            letter-spacing: 1px;
        }
        
        .website {
            font-style: italic;
        }
        
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .cover {
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="cover">
        <!-- Header -->
        <div class="header">
            <h1 class="journal-title">UNIVERSAL<br>JOURNAL NEWS</h1>
            <div class="journal-subtitle">International Medical Research Journal</div>
        </div>
        
        <!-- Main Content -->
        <div class="content">
            <!-- Volume Info -->
            <div class="volume-info">
                <div class="volume-text">VOLUME 1</div>
                <div class="issue-text">ISSUE 1</div>
                <div class="date">FEBRUARY 2026</div>
            </div>
            
            <!-- Medical Symbol -->
            <div class="medical-symbol">⚕</div>
            
            <!-- Topics -->
            <div class="topics">
                <div class="topics-title">FEATURED TOPICS</div>
                <div class="topics-list">
                    <div class="topic-item">Clinical Medicine</div>
                    <div class="topic-item">Public Health</div>
                    <div class="topic-item">Medical Research</div>
                    <div class="topic-item">Healthcare Innovation</div>
                    <div class="topic-item">Epidemiology</div>
                    <div class="topic-item">Medical Education</div>
                </div>
            </div>
        </div>
        
        <!-- Footer -->
        <div class="footer">
            <div class="footer-content">
                <div class="issn">ISSN: [Pending]</div>
                <div class="website">www.universaljournalnews.uz</div>
            </div>
        </div>
    </div>
</body>
</html>
